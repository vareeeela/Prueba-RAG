rutas:
  documentos: "documentos"
  bd_vectorial: "bd_vectorial"
  coleccion: "documentos_rag"

embeddings:
  modelo: "intfloat/multilingual-e5-large"

retrieval:
  n_resultados: 15
  chunk_size: 1200
  chunk_overlap: 200
  min_chunk_len: 80
  similarity_threshold: 0.55
  n_query_variants: 3
  extensiones:
    - ".pdf"
    - ".docx"
    - ".pptx"
    - ".xlsx"
    - ".txt"
    - ".md"

llm:
  modo: "groq"
  modelo_groq: "llama-3.3-70b-versatile"   # alternativa cuando se deprece: qwen/qwen3.6-27b
  modelo_local: "llama3.2"
  max_turnos_historial: 6
  temperature: 0.2
  max_tokens: 800
